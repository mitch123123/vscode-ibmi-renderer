<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="{elements}" type="module"></script>
  <script src="{konva}"></script>
  <script src="{main}"></script>
  <link rel="stylesheet" href="{styles}">
  <link rel="stylesheet" href="{codicon}" id="vscode-codicon-stylesheet">
</head>

<body style="padding: 0; margin: 0;">
  <div id="connectionBanner" class="connection-banner" role="status" aria-live="polite" hidden>
    IBM i connection lost — editing is disabled until you reconnect.
  </div>
  <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>
  <div class="toolbar">
    <div class="toolbar-start">
      <div class="view-switch" role="tablist" aria-label="Editor view">
        <button type="button" class="view-switch-btn active" role="tab" aria-selected="true" disabled>
          Design
        </button>
        <button type="button" id="showSourceBtn" class="view-switch-btn" role="tab" aria-selected="false">
          Source
        </button>
      </div>
      <div id="recordFormatTabs" class="format-tabs" role="tablist" aria-label="Record formats"></div>
    </div>
    <div class="toolbar-actions">
      <span id="cursorBadge" class="badge"></span>
      <span id="modeBadge" class="badge">Design</span>
      <select id="screenSizeSelect" title="Screen size" aria-label="Screen size">
        <option value="auto">Size: Auto (DDS)</option>
        <option value="ds3">24 × 80 (*DS3)</option>
        <option value="ds4">27 × 132 (*DS4)</option>
      </select>
      <vscode-button id="modeToggle" secondary>Design / Preview</vscode-button>
    </div>
  </div>

  <div class="layout">
    <aside id="leftSidebar" class="sidebar left" aria-label="Format tools">
      <div class="sidebar-header">
        <span class="sidebar-header-title">Format</span>
        <button type="button" id="collapseLeftSidebar" class="sidebar-collapse-btn" title="Minimize left panel" aria-label="Minimize left panel">
          ◀
        </button>
      </div>
      <div id="recordFormatSidebar" class="sidebar-body"></div>
    </aside>
    <button type="button" id="expandLeftSidebar" class="sidebar-rail left" title="Show format tools" aria-label="Show format tools" hidden>
      ▶
    </button>

    <div class="canvas-wrap" role="tabpanel" id="canvasTabPanel" aria-label="Design surface">
      <div id="container" tabindex="0" role="application" aria-label="Display file design surface"></div>
    </div>

    <button type="button" id="expandRightSidebar" class="sidebar-rail right" title="Show field tools" aria-label="Show field tools" hidden>
      ◀
    </button>
    <aside id="rightSidebar" class="sidebar right" aria-label="Field tools">
      <div class="sidebar-header">
        <button type="button" id="collapseRightSidebar" class="sidebar-collapse-btn" title="Minimize right panel" aria-label="Minimize right panel">
          ▶
        </button>
        <span class="sidebar-header-title">Fields</span>
      </div>
      <div id="keywordEditorArea" class="keyword-editor-area"></div>
      <div id="fieldInfoSidebar" class="sidebar-body"></div>
    </aside>
  </div>
</body>
</html>
